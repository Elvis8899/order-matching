version: "3.9"
name: "exchange"

services:
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./util/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
      - postgres
    networks:
      - nginx_network
    environment:
      UPLOAD_FILE_SIZE_LIMIT: 20

  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.backend
    container_name: exchange-api-prod
    hostname: exchange-api
    restart: always
    image: exchange-api
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      # nginx reaches the app through this network: trust its
      # X-Forwarded-For, so login rate limits apply per client IP
      TRUST_PROXY: "172.18.0.0/16"
    networks:
      - "nginx_network"
    depends_on:
      - postgres

  postgres:
    container_name: postgres-container-prod
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "exchange"
    volumes:
      - exchange-postgres:/var/lib/postgresql/data
    networks:
      - "nginx_network"

  migrate-deploy:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.backend
      target: migrate
    container_name: migrate-deploy-prod
    image: exchange-api-deploy
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    ports:
      - "3001:3001"
    networks:
      - "nginx_network"
    depends_on:
      - postgres

networks:
  nginx_network:
    external: true

volumes:
  exchange-postgres:
