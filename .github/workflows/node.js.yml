# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        ## See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: exchange-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          cache-dependency-path: ./backend/yarn.lock

      - name: run yarn commands
        working-directory: backend
        run: |
          yarn && CI=true
          yarn test:migrate
          # Fails when schema.prisma has changes no migration creates
          yarn migrate:check
          yarn build
          yarn test:cov

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/coverage-summary.json

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ./frontend/.nvmrc
          cache: "yarn"
          cache-dependency-path: ./frontend/yarn.lock

      - name: Lint, test and build
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn test:cov
          yarn build

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json

  badges:
    needs: [build, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage summary
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage summary
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: 🔴 Delete remote badges branch
        # The branch does not exist on the first run
        run: git push origin --delete badges || true

      - name: ➕ Create badges branch
        run: git checkout -b badges

      # The part of the path matched by ** names each badge folder:
      # badges/backend and badges/frontend
      - name: ⚙️ Generating coverage badges
        uses: jpb06/coverage-badges-action@latest
        with:
          branches: "*"
          target-branch: badges
          coverage-summary-path: |
            ./**/coverage/coverage-summary.json

      - name: ⬆️ Push badges branch
        run: git push origin badges
